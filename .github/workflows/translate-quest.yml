name: Translate TERA Quest

# Tlumaczy paczke malych StrSheet_Quest-*.xml na jednym cache.
# start+count = wycinek posortowanej listy plikow (domyslnie 50).
on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Folder source/StrSheet_Quest albo jeden XML"
        required: true
        default: "source/StrSheet_Quest"
      start:
        description: "Pomin pierwsze N plikow (0, 50, 100...)"
        required: false
        default: "0"
      count:
        description: "Ile plikow w tej paczce. 0 = wszystkie pozostale"
        required: false
        default: "0"
      batch_size:
        description: "Ile unikalnych stringow na zapytanie Gemini"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: translate-quest
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj biblioteki
        run: pip install -r requirements.txt

      - name: Przetlumacz paczke Quest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python translate_quest.py "${{ inputs.input_path }}" \
            --output-dir output/StrSheet_Quest \
            --start "${{ inputs.start }}" \
            --count "${{ inputs.count }}" \
            --batch-size "${{ inputs.batch_size }}"

      - name: Sprawdz jakosc paczki
        if: always()
        continue-on-error: true
        run: |
          python check_quest.py output/StrSheet_Quest \
            --source "${{ inputs.input_path }}"

      - name: Zapisz wynik do repozytorium
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output cache || true
          if git diff --staged --quiet; then
            echo "Brak zmian do zapisania."
          else
            git commit -m "Tlumaczenie Quest pack start=${{ inputs.start }} count=${{ inputs.count }}"
            git pull --rebase
            git push
          fi
